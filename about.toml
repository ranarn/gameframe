# cargo-about: generates the third-party notices shipped with the installer
# (see installer/build.ps1). Keep `accepted` identical to [licenses].allow in
# deny.toml. Nothing checks that; edit both together.
#
# The static "Bundled fonts" section in installer/third-party-notices.hbs is
# hand-written from epaint_default_fonts 0.37.0 (pulled in by egui). Re-check it
# whenever egui, and so that crate, is bumped.

accepted = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
