# cargo-about: generates the third-party notices shipped with the installer
# (see installer/build.ps1). Keep `accepted` identical to [licenses].allow in
# deny.toml (which points back here). Nothing checks that; edit both together.
# The 0.9 confidence threshold deny.toml uses is a CLI flag in cargo-about
# (--threshold); see installer/build.ps1 and the cargo-about job in
# .github/workflows/pull-request.yml.

accepted = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
