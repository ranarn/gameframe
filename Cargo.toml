[package]
name = "gameframe"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37.0", features = ["persistence"] }
egui = "0.37.0"
global-hotkey = "0.9.0"
muda = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
steamlocate = "2.1.1"
toml = "1.1.8"
tray-icon = "0.26.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = "0.4.34"
tempfile = "3.27.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
winresource = "0.1.34"
