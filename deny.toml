# cargo-deny: run by the `deny` job in .github/workflows/pull-request.yml.

[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
# Unmaintained crates are reported but don't fail the build; vulnerabilities
# and yanked versions do.
unmaintained = "none"
yanked = "deny"

[licenses]
# Keep identical to `accepted` in about.toml (cargo-about notices); installer/build.ps1 checks that
# (in the release build and the PR `third-party-notices` job) and fails naming any difference.
# Licenses that can be combined with GameFrame's GPL-3.0-or-later. OFL-1.1 and
# Ubuntu-font-1.0 cover the fonts egui embeds.
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

# Build-time only (psm's build script, via steamlocate -> pest); never linked
# into the shipped binary, so cargo-about (ignore-build-dependencies) skips it.
# Apache-2.0 WITH LLVM-exception is GPL-3.0 compatible. Scoped to this crate so
# the allow list stays identical to about.toml's `accepted`.
[[licenses.exceptions]]
crate = "ar_archive_writer"
allow = ["Apache-2.0 WITH LLVM-exception"]

[licenses.private]
# GameFrame itself (`publish = false`).
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
