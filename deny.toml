# cargo-deny: run by the `deny` job in .github/workflows/pull-request.yml.

[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
# Unmaintained crates are reported but don't fail the build; vulnerabilities
# and yanked versions do.
unmaintained = "none"
yanked = "deny"

[licenses]
# Licenses that can be combined with GameFrame's GPL-3.0-or-later. OFL-1.1 and
# Ubuntu-font-1.0 cover the fonts egui embeds.
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# GameFrame itself (`publish = false`).
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
