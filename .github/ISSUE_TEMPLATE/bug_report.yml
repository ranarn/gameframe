name: Bug report
description: Something in GameFrame doesn't work as expected
labels: [bug, needs-triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: GameFrame version
      description: Shown in Settings, or in the first line of the log file.
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game or application involved
  - type: input
    id: windows
    attributes:
      label: Windows version and display scaling
      placeholder: e.g. Windows 11 24H2, 150 %
  - type: textarea
    id: log
    attributes:
      label: Log
      description: >
        Relevant lines from `%APPDATA%\GameFrame\gameframe.log`. It contains
        window titles and executable paths, so remove anything you'd rather
        not share.
      render: text
