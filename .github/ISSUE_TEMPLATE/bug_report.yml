name: Bug report
description: Something in GameFrame doesn't work as expected
labels: [bug, needs-triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: GameFrame version
      description: >
        Shown in GameFrame's Settings > About. Also in Windows Settings > Apps >
        GameFrame, and in the most recent `GameFrame <version> started` line of
        `%APPDATA%\GameFrame\gameframe.log` (or `gameframe.old.log` next to it,
        if the log has rotated).
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game or application involved
  - type: input
    id: windows
    attributes:
      label: Windows version and display scaling
      placeholder: e.g. Windows 11 24H2, 150 %
  - type: textarea
    id: log
    attributes:
      label: Log
      description: >
        Relevant lines from `%APPDATA%\GameFrame\gameframe.log` (and
        `gameframe.old.log`, the rotated log, if the problem is older). They
        contain window titles and executable paths, so remove anything you'd rather
        not share.
      render: text
