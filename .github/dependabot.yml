version: 2
updates:
  # Wait 3 days before proposing a new release: compromised versions are
  # usually caught and yanked within days.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    # Renders as `fix(deps...): ...` so Dependabot updates trigger a patch
    # release; `chore` would not. Dependabot's `prefix-development` and the groups'
    # `dependency-type` are not supported for cargo, so dev dependencies get
    # the same prefix (ungrouped dev updates render as `fix(deps-dev)`).
    commit-message:
      prefix: fix
      include: scope
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
