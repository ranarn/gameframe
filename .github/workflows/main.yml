name: Main

# Not a merge gate (pull-request.yml is): builds every commit on main into a
# downloadable installer, and checks the dependencies weekly for new
# advisories. release.yml only releases a commit whose run here is green.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main saves the cache; PR runs restore it without evicting main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test
        run: cargo test --locked

  build:
    if: github.event_name != 'schedule'
    uses: $/.github/workflows/build.yml

  # On a schedule event audit-check opens an issue per new advisory affecting
  # Cargo.lock, which can happen without anyone pushing.
  audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
