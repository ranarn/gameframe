name: Main

# Not a merge gate (pull-request.yml is): builds every commit on main into a
# downloadable installer, and checks the dependencies weekly for new
# advisories. release.yml only releases a commit whose run here is green.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main saves the cache; PR runs restore it without evicting main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test
        run: cargo test --locked

  build:
    if: github.event_name != 'schedule'
    uses: $/.github/workflows/build.yml

  # On a schedule event, fails the run on a new advisory affecting Cargo.lock,
  # which can happen without anyone pushing. Goes through deny.toml so only the
  # Windows target counts: a whole-lockfile audit flags Linux-only crates
  # pulled in by eframe that never ship.
  audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command-arguments: advisories
