name: PR title

# The squash-merge commit takes the PR title, and the release workflow derives
# the next version from those commits (feat -> minor, fix -> patch,
# `!` -> major). Separate from pull-request.yml so that editing the title
# re-runs only this check.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
