name: Release

# Started by hand (Actions -> Release -> Run workflow) on main. Release Pilot
# derives the next version from the conventional commits since the last tag
# (feat -> minor, fix -> patch, `!` -> major); the installer is built with
# that version and attached to a draft GitHub release, which the maintainer
# reviews and publishes. Only commits whose main.yml push run is green are
# released, and nothing is tagged if the build fails.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only show the next version and changelog
        type: boolean
        default: false
      allow-major:
        description: Deliberately release a new major version (e.g. 1.0.0); without it a major bump below 1.0 is refused
        type: boolean
        default: false
      minor-pre-major:
        description: Below 1.0, release a breaking change as a minor bump (e.g. 0.5.0 -> 0.6.0) instead of 1.0.0
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - name: Require a green main build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          run=$(gh run list --workflow main.yml --event push --commit "$SHA" --limit 1 --json status,conclusion,url)
          echo "$run"
          if [ "$(jq -r '.[0].conclusion' <<<"$run")" != "success" ]; then
            echo "::error::main.yml has no successful push run for $SHA yet"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: next
        uses: ranarn/release-pilot@b3df6e8ee723f90850472a6e63d58fc34b129b90 # v1.3.0
        with:
          dry-run: true
          default-bump: none
          bump-minor-pre-major: ${{ inputs.minor-pre-major }}

      - name: Require something to release
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "::error::No feat or fix commits since the last release"
            exit 1
          fi
          echo "Next version: $VERSION"

      # Computed here from the versions themselves, independent of how
      # Release Pilot treats breaking changes below 1.0. The previous version
      # is Release Pilot's own previous-version output: it bases the bump on
      # the highest semver tag with the prefix, not the nearest reachable one
      # (findLatestTag in src/release/tags.ts, ranarn/release-pilot v1.3.0),
      # so this guard compares against exactly what it bumped from.
      - name: Guard against an accidental major bump
        env:
          VERSION: ${{ steps.next.outputs.version }}
          PREV_TAG: ${{ steps.next.outputs.previous-tag }}
          PREV_VERSION: ${{ steps.next.outputs.previous-version }}
          ALLOW_MAJOR: ${{ inputs.allow-major }}
        run: |
          # Release Pilot reports no previous tag as an empty value. Only then
          # is 0.0.0 the right baseline; a tag without a version means the
          # output is missing or renamed, so fail closed rather than treat
          # every run as coming from 0.0.0.
          if [ -z "$PREV_TAG" ]; then
            prev=0.0.0
          elif [ -z "$PREV_VERSION" ]; then
            echo "::error::Release Pilot reported previous tag '$PREV_TAG' but no previous-version output; refusing to guess the baseline."
            exit 1
          else
            prev=$PREV_VERSION
          fi
          prev_major=${prev%%.*}
          next_major=${VERSION%%.*}
          # Fail closed: a non-numeric major would make the comparison below
          # error out inside `if` and silently fall through to "allowed".
          if ! [[ "$prev_major" =~ ^[0-9]+$ && "$next_major" =~ ^[0-9]+$ ]]; then
            echo "::error::Cannot compare versions: previous '$prev' (tag '$PREV_TAG'), next '$VERSION'. Both must start with a numeric major."
            exit 1
          fi
          if [ "$next_major" -gt "$prev_major" ] && [ "$prev_major" -lt 1 ]; then
            if [ "$ALLOW_MAJOR" = "true" ]; then
              echo "Major guard: $prev -> $VERSION is a major bump, allowed by allow-major"
            else
              echo "Major guard: $prev -> $VERSION is a major bump, refused"
              echo "::error::Release Pilot computed $VERSION from $prev, a major bump while below 1.0. If this jump is intended, re-run the workflow with allow-major enabled."
              exit 1
            fi
          else
            echo "Major guard: $prev -> $VERSION, allowed (no major bump from below 1.0)"
          fi

  build:
    needs: plan
    if: ${{ !inputs.dry-run }}
    uses: $/.github/workflows/build.yml
    with:
      version: ${{ needs.plan.outputs.version }}

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    # Holds the signing secrets and waits for the required reviewers set on the
    # `release` environment (Settings -> Environments). See SECURITY.md.
    environment: release
    permissions:
      contents: write
    env:
      # minisign 0.12, the Linux build of the upstream release. Pinned by
      # SHA-256 like Inno Setup in build.yml; the tarball is not signed by us.
      MINISIGN_URL: https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
      MINISIGN_SHA256: 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
    steps:
      # Release Pilot pushes the tag with git, so the checkout keeps its
      # credentials in this job only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: dist

      # Sign the installer with the release key so GameFrame can check who
      # published it (authenticity; the SHA-256 only covers integrity). Runs
      # before anything is tagged: a missing secret or a signature that does
      # not verify against PUBLIC_KEY in src/updater.rs fails the release
      # here. The secrets are visible to this step only.
      - name: Sign the installer
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::The MINISIGN_SECRET_KEY secret is not set in the 'release' environment; the updater refuses unsigned installers. See SECURITY.md."
            exit 1
          fi
          installer="dist/GameFrame-Setup-${VERSION}.exe"
          if [ ! -f "$installer" ]; then
            echo "::error::$installer not found in the build artifact"
            exit 1
          fi

          # The public key GameFrame will check against, from the PUBLIC_KEY
          # constant in src/updater.rs (the same commit the installer was built
          # from). Comment lines are dropped and the rest joined, so a constant
          # rustfmt wrapped onto two lines still reads. NEXT_PUBLIC_KEY is not
          # checked here: it only lets installs accept the NEXT signing key
          # once it is in use, and a release is always signed with the key
          # PUBLIC_KEY names (during a rotation, release N is signed with the old
          # key, release N+1 has the new key as PUBLIC_KEY). See SECURITY.md.
          updater_src=$(grep -v '^[[:space:]]*//' src/updater.rs | tr '\n' ' ')
          pub=$(grep -oP 'const PUBLIC_KEY: &str =\s*"\K[^"]*(?=")' <<<"$updater_src" || true)
          if [ -n "$pub" ] && [ "$(wc -l <<<"$pub")" -ne 1 ]; then
            echo "::error::src/updater.rs defines PUBLIC_KEY more than once; this step expects exactly one. See SECURITY.md."
            exit 1
          fi
          if [ -z "$pub" ]; then
            echo "::error::The PUBLIC_KEY constant in src/updater.rs could not be read (renamed, empty or not a plain string literal); this step must be updated to match. See SECURITY.md."
            exit 1
          fi
          if [ "$pub" = "REPLACE_WITH_MINISIGN_PUBLIC_KEY" ]; then
            echo "::error::PUBLIC_KEY in src/updater.rs is still the placeholder; set it to the public key of the signing key. See SECURITY.md."
            exit 1
          fi
          if ! grep -qE '^RW[A-Za-z0-9+/]{54}$' <<<"$pub"; then
            echo "::error::PUBLIC_KEY in src/updater.rs is not a Minisign public key (the 56-character base64 second line of gameframe.pub, starting RW). See SECURITY.md."
            exit 1
          fi

          bin_dir="$RUNNER_TEMP/minisign"
          mkdir -p "$bin_dir"
          curl --fail --silent --show-error --location "$MINISIGN_URL" --output "$bin_dir/minisign.tar.gz"
          echo "$MINISIGN_SHA256  $bin_dir/minisign.tar.gz" | sha256sum --check --strict -
          tar -xzf "$bin_dir/minisign.tar.gz" -C "$bin_dir" minisign-linux/x86_64/minisign
          minisign="$bin_dir/minisign-linux/x86_64/minisign"

          key_file="$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$key_file"' EXIT
          # A key file made on Windows has CRLF line endings, which minisign on
          # Linux cannot decode ("Error while loading the secret key file"), so
          # the secret and the password are stripped of carriage returns.
          (umask 077; printf '%s\n' "$MINISIGN_SECRET_KEY" | tr -d '\r' > "$key_file")
          if [ "$(grep -c . "$key_file")" -ne 2 ]; then
            echo "::error::MINISIGN_SECRET_KEY must be the whole key file: the 'untrusted comment:' line and the key line. See SECURITY.md."
            exit 1
          fi
          # minisign reads the password of an encrypted key from stdin when it
          # is not a terminal; an unencrypted key ignores it.
          MINISIGN_PASSWORD="${MINISIGN_PASSWORD%$'\r'}"
          # The trusted comment binds the signature to this release's installer
          # name, so an older signed installer re-published under a newer
          # release is refused by GameFrame (it requires exactly this comment).
          printf '%s\n' "$MINISIGN_PASSWORD" | "$minisign" -S -s "$key_file" -m "$installer" -x "$installer.minisig" -t "file:GameFrame-Setup-${VERSION}.exe"

          # Prove the secret belongs to the embedded public key.
          if ! "$minisign" -V -P "$pub" -m "$installer" -x "$installer.minisig"; then
            echo "::error::The signature does not verify against PUBLIC_KEY in src/updater.rs; the MINISIGN_SECRET_KEY secret belongs to another key. See SECURITY.md."
            exit 1
          fi

      # The real run below pushes its tag before anything can compare it with
      # the version the installer was built as, so the same inputs are first
      # run as a dry run on the same checkout. It must land on plan's tag:
      # either as the new tag, or, on a re-run of this job ("Re-run failed
      # jobs") after the first attempt pushed it, as the tag already on the
      # release commit. Anything else (plan's tag pushed to another commit
      # since, or another release in between) is refused before tagging.
      - id: check
        uses: ranarn/release-pilot@b3df6e8ee723f90850472a6e63d58fc34b129b90 # v1.3.0
        with:
          dry-run: true
          default-bump: none
          bump-minor-pre-major: ${{ inputs.minor-pre-major }}
          commit-sha: ${{ github.sha }}

      - name: Require plan's tag
        env:
          PLANNED: ${{ needs.plan.outputs.tag }}
          TAG: ${{ steps.check.outputs.tag }}
          EXISTING: ${{ steps.check.outputs.existing-tag }}
          SHA: ${{ github.sha }}
        run: |
          if [ -n "$TAG" ] && [ "$TAG" = "$PLANNED" ]; then
            echo "Release Pilot will tag $PLANNED"
          elif [ -z "$TAG" ] && [ "$EXISTING" = "$PLANNED" ]; then
            echo "$PLANNED already tags $SHA from an earlier attempt; completing its release"
          else
            echo "::error::The installer was built as $PLANNED, but Release Pilot would now tag '${TAG}' (tag already on $SHA: '${EXISTING}')"
            exit 1
          fi

      # Creates the draft release and attaches the signed installer and its
      # .minisig. On a re-run it completes the draft from the earlier
      # attempt, replacing same-name assets, creates the release if the tag
      # has none, and fails without touching anything if it is published.
      - id: release
        uses: ranarn/release-pilot@b3df6e8ee723f90850472a6e63d58fc34b129b90 # v1.3.0
        with:
          default-bump: none
          bump-minor-pre-major: ${{ inputs.minor-pre-major }}
          commit-sha: ${{ github.sha }}
          create-release: true
          release-draft: true
          release-title: GameFrame {{tag}}
          release-files: dist/*
