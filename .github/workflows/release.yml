name: Release

# Started by hand (Actions -> Release -> Run workflow) on main. Release Pilot
# derives the next version from the conventional commits since the last tag
# (feat -> minor, fix -> patch, `!` -> major); the installer is built with
# that version and attached to a draft GitHub release, which the maintainer
# reviews and publishes. Only commits whose main.yml push run is green are
# released, and nothing is tagged if the build fails.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only show the next version and changelog
        type: boolean
        default: false
      allow-major:
        description: Deliberately release a new major version (e.g. 1.0.0); without it a major bump below 1.0 is refused
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - name: Require a green main build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          run=$(gh run list --workflow main.yml --event push --commit "$SHA" --limit 1 --json status,conclusion,url)
          echo "$run"
          if [ "$(jq -r '.[0].conclusion' <<<"$run")" != "success" ]; then
            echo "::error::main.yml has no successful push run for $SHA yet"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: next
        uses: ranarn/release-pilot@3ea1793e95926ed237bd8e9e1633987c05763b1b # v1.1.0
        with:
          dry-run: true
          default-bump: none

      - name: Require something to release
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "::error::No feat or fix commits since the last release"
            exit 1
          fi
          echo "Next version: $VERSION"

      # Computed here from the versions themselves, independent of how
      # Release Pilot treats breaking changes below 1.0. The previous version
      # is Release Pilot's own previous-version output: it bases the bump on
      # the highest semver tag with the prefix, not the nearest reachable one
      # (findLatestTag in src/release/tags.ts, ranarn/release-pilot v1.1.0),
      # so this guard compares against exactly what it bumped from.
      - name: Guard against an accidental major bump
        env:
          VERSION: ${{ steps.next.outputs.version }}
          PREV_TAG: ${{ steps.next.outputs.previous-tag }}
          PREV_VERSION: ${{ steps.next.outputs.previous-version }}
          ALLOW_MAJOR: ${{ inputs.allow-major }}
        run: |
          # Release Pilot reports no previous tag as an empty value. Only then
          # is 0.0.0 the right baseline; a tag without a version means the
          # output is missing or renamed, so fail closed rather than treat
          # every run as coming from 0.0.0.
          if [ -z "$PREV_TAG" ]; then
            prev=0.0.0
          elif [ -z "$PREV_VERSION" ]; then
            echo "::error::Release Pilot reported previous tag '$PREV_TAG' but no previous-version output; refusing to guess the baseline."
            exit 1
          else
            prev=$PREV_VERSION
          fi
          prev_major=${prev%%.*}
          next_major=${VERSION%%.*}
          # Fail closed: a non-numeric major would make the comparison below
          # error out inside `if` and silently fall through to "allowed".
          if ! [[ "$prev_major" =~ ^[0-9]+$ && "$next_major" =~ ^[0-9]+$ ]]; then
            echo "::error::Cannot compare versions: previous '$prev' (tag '$PREV_TAG'), next '$VERSION'. Both must start with a numeric major."
            exit 1
          fi
          if [ "$next_major" -gt "$prev_major" ] && [ "$prev_major" -lt 1 ]; then
            if [ "$ALLOW_MAJOR" = "true" ]; then
              echo "Major guard: $prev -> $VERSION is a major bump, allowed by allow-major"
            else
              echo "Major guard: $prev -> $VERSION is a major bump, refused"
              echo "::error::Release Pilot computed $VERSION from $prev, a major bump while below 1.0. If this jump is intended, re-run the workflow with allow-major enabled."
              exit 1
            fi
          else
            echo "Major guard: $prev -> $VERSION, allowed (no major bump from below 1.0)"
          fi

  build:
    needs: plan
    if: ${{ !inputs.dry-run }}
    uses: $/.github/workflows/build.yml
    with:
      version: ${{ needs.plan.outputs.version }}

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Release Pilot pushes the tag with git, so the checkout keeps its
      # credentials in this job only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: dist

      # A re-run of this job ("Re-run failed jobs") reuses plan's tag and
      # build's artifact, but the tag may already exist from the first
      # attempt. Reuse it when it points at the release commit; refuse when
      # it points elsewhere.
      - id: existing
        name: Detect a tag from an earlier attempt
        env:
          PLANNED: ${{ needs.plan.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          refs=$(git ls-remote --tags origin "refs/tags/$PLANNED" "refs/tags/$PLANNED^{}")
          # An annotated tag lists its own object and the peeled commit
          # (^{}); a lightweight tag lists the commit directly.
          tag_commit=$(awk '$2 ~ /\^\{\}$/ {print $1}' <<<"$refs")
          if [ -z "$tag_commit" ]; then
            tag_commit=$(awk '{print $1}' <<<"$refs")
          fi
          if [ -z "$tag_commit" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          elif [ "$tag_commit" = "$SHA" ]; then
            echo "Tag $PLANNED already exists at $SHA; reusing it"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Tag $PLANNED already exists at $tag_commit, not at the release commit $SHA"
            exit 1
          fi

      - id: release
        if: steps.existing.outputs.exists != 'true'
        uses: ranarn/release-pilot@3ea1793e95926ed237bd8e9e1633987c05763b1b # v1.1.0
        with:
          default-bump: none
          commit-sha: ${{ github.sha }}
          create-release: true
          release-draft: true
          release-title: GameFrame {{tag}}

      - name: Attach the installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PLANNED: ${{ needs.plan.outputs.tag }}
          TAG: ${{ steps.release.outputs.tag }}
          REUSED: ${{ steps.existing.outputs.exists }}
        run: |
          if [ "$REUSED" = "true" ]; then
            # Find an existing release (draft or published, either counts on a
            # re-run) by listing, which includes drafts, so this existence
            # check does not depend on gh's tag-to-draft fallback (the upload
            # below still finds the draft by tag, and fails loudly if it
            # can't, rather than creating a duplicate). Any lookup failure
            # (network, auth, rate limit, bad JSON) must fail the job rather
            # than risk a duplicate draft.
            if ! releases=$(gh release list --limit 1000 --json tagName); then
              echo "::error::Could not list releases"
              exit 1
            fi
            if ! count=$(jq -r --arg tag "$PLANNED" '[.[] | select(.tagName == $tag)] | length' <<<"$releases") || ! [[ "$count" =~ ^[0-9]+$ ]]; then
              echo "::error::Could not parse the release list"
              exit 1
            fi
            if [ "$count" -gt 0 ]; then
              echo "Found the existing release for $PLANNED"
            else
              echo "::warning::No release exists for $PLANNED; creating a draft with generated notes. Review the notes before publishing."
              gh release create "$PLANNED" --verify-tag --draft --title "GameFrame $PLANNED" --generate-notes
            fi
          elif [ "$TAG" != "$PLANNED" ]; then
            echo "::error::Release Pilot tagged $TAG, but the installer was built as $PLANNED"
            exit 1
          fi
          gh release upload "$PLANNED" dist/* --clobber
